name: build image

# Shared by release.yml (tag -> publishes) and verify.yml (recipe changes -> does not).
# The build and the check live here and only here, so the two callers cannot drift.
on:
  workflow_call:
    inputs:
      ghidra_ver:
        description: Ghidra release to build; empty falls back to build.sh's default
        type: string
        required: false
        default: ''
      publish:
        description: Push the built image to GHCR
        type: boolean
        required: false
        default: false

# IMAGE_NAME, not IMAGE: build.sh reads IMAGE as its output-tag override, and a
# workflow-level env of that name silently wins over the default (it did).
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # arm64 natively: the artifact *is* an arm64 decompiler, and building it under qemu
    # on an x86 runner is an order of magnitude slower. Free for public repositories.
    runs-on: ubuntu-24.04-arm
    # No permissions block on purpose: a called workflow that requests more than its
    # caller grants fails at startup with no log, which is exactly what happened here.
    # The callers declare what they need.
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          ver="${{ inputs.ghidra_ver }}"
          # A tag push names the version. A branch push or a PR does not, and there
          # build.sh's default is the right answer.
          if [ -z "$ver" ] && [[ "${GITHUB_REF_NAME}" == v[0-9]* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          fi
          echo "ghidra=${ver:-<build.sh default>} publish=${{ inputs.publish }} ref=${GITHUB_REF_NAME}"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      # An empty GHIDRA_VER falls through to build.sh's own default, via ${VAR:-default}.
      - name: Build
        run: GHIDRA_VER="${{ steps.ver.outputs.ver }}" IMAGE=ghidra:arm64 ./build.sh

      # The reason this image exists is that decompiles fail on arm64, so verify that a
      # real one does not. /bin/true is a small aarch64 ELF with 239 functions.
      - name: Verify a decompile actually succeeds
        run: |
          set -eux
          mkdir -p /tmp/smoke/proj
          cp /bin/true /tmp/smoke/
          out=$(docker run --rm -v /tmp/smoke:/work -v "$PWD:/repo:ro" ghidra:arm64 \
            /opt/ghidra/support/analyzeHeadless /work/proj SMOKE -import /work/true \
            -processor AARCH64:LE:64:v8A -scriptPath /repo \
            -postScript DecompileAll.java /work/decomp.c 2>&1)
          echo "$out" | grep -oE "DECOMPILED ok=[0-9]+ failed=[0-9]+" | tail -1
          echo "$out" | grep -qE "DECOMPILED ok=[1-9][0-9]* failed=0"
          test -s /tmp/smoke/decomp.c

      - name: Push to GHCR
        if: inputs.publish
        run: |
          set -eux
          ver="${{ steps.ver.outputs.ver }}"
          test -n "$ver"
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker tag ghidra:arm64 "$REGISTRY/$IMAGE_NAME:$ver"
          docker tag ghidra:arm64 "$REGISTRY/$IMAGE_NAME:latest"
          docker push "$REGISTRY/$IMAGE_NAME:$ver"
          docker push "$REGISTRY/$IMAGE_NAME:latest"
