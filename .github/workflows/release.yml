name: release

# Publishing is tag-only. A README or docs commit triggers nothing; a v<version> tag is
# what mints an image.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ghidra_ver:
        description: Ghidra release to build and publish, e.g. 12.1.3
        required: true
        default: '12.1.3'

jobs:
  publish:
    uses: ./.github/workflows/_build.yml
    # Declared here as well as in the reusable workflow: a called workflow's token
    # permissions can only be narrower than its caller's.
    permissions:
      contents: read
      packages: write
    with:
      ghidra_ver: ${{ inputs.ghidra_ver }}
      publish: true
